name: Build and Test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 18.x
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: |
          if [ -n "${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}" ]; then
            echo "Running build with Firebase credentials"
            FIREBASE_SERVICE_ACCOUNT_JSON='${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' npm run build
          else
            echo "No Firebase credentials found (PR from fork). Using dummy config."
            FIREBASE_SERVICE_ACCOUNT_JSON='{}' npm run build
          fi
